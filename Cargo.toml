[workspace]
members = [
    "crates/burntty",
    "crates/burntty-daemon",
    "crates/burntty-protocol",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.1"

[workspace.dependencies]
anyhow = "1.0"
burntty-protocol = { path = "crates/burntty-protocol" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
portable-pty = "0.9"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
